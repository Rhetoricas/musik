<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Music</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; }
    body { background-color: #000; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px 16px; }
    .main-wrap { width: 100%; max-width: 960px; display: flex; flex-direction: column; flex: 1; justify-content: flex-start; }
    
    .btn-fs { width: 100%; background: transparent; color: #888; border: none; border-bottom: 0.5px solid rgba(255,255,255,0.2); padding: 8px 0; margin-bottom: 14px; font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; cursor: pointer; text-align: right; }
    .btn-fs.hidden { display: none; }
    
    .panel { width: 100%; }
    
    .btn { background: transparent; color: #fff; border: 0.5px solid rgba(255,255,255,0.35); padding: 14px 16px; font-size: 0.82rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; cursor: pointer; width: 100%; text-align: center; display: block; transition: background 0.15s, color 0.15s; }
    .btn:active { background: rgba(255,255,255,0.12); }
    .btn-primary { background: #fff; color: #000; border: 0.5px solid #fff; font-weight: 600; }
    .btn-small { background: transparent; color: #999; border: 0.5px solid rgba(255,255,255,0.2); font-size: 0.72rem; padding: 10px 12px; margin-top: 8px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; }
    .btn-talk.active { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
    
    .score-section { width: 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .score-bar-header { font-size: 0.65rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; color: rgba(167, 243, 208, 0.65); }
    
    .points-grid { display: grid; grid-template-columns: repeat(7, 1fr); width: 100%; border-top: 0.5px solid rgba(110, 231, 183, 0.35); border-bottom: 0.5px solid rgba(110, 231, 183, 0.35); }
    .btn-pt { background: transparent; color: #a7f3d0; border: none; border-right: 0.5px solid rgba(110, 231, 183, 0.2); min-height: 54px; font-size: 1.2rem; font-weight: 400; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-pt:last-child { border-right: none; }
    .btn-pt-max { color: #fff; font-weight: 600; background: rgba(82, 183, 136, 0.08); }
    .btn-pt:active { background: #a7f3d0; color: #000; }
    
    input[type="text"], select { width: 100%; padding: 12px 0; border: none; border-bottom: 0.5px solid rgba(255,255,255,0.35); background: #000; color: #fff; font-size: 0.95rem; margin-top: 4px; margin-bottom: 16px; outline: none; }
    label { font-size: 0.7rem; color: #777; text-transform: uppercase; letter-spacing: 0.12em; display: block; }
    
    #reader { width: 100%; background: #000; }
    
    .stage-grid { display: grid; grid-template-columns: 1fr; gap: 14px; width: 100%; align-items: start; }
    .visual-column { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .controls-column { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    
    .status-box { padding: 26px 0; text-align: center; border-bottom: 0.5px solid rgba(255,255,255,0.18); }
    .status-box.paused .timer-readout { color: #fff; }
    .status-box.paused .status-label { color: #fff; }
    .timer-readout { font-size: 4.2rem; font-weight: 200; line-height: 1; letter-spacing: -0.04em; margin-bottom: 8px; }
    .status-label { font-size: 0.75rem; font-weight: 400; text-transform: uppercase; letter-spacing: 0.16em; color: #888; }
    
    .cover-wrap { width: 100%; background: #000; display: none; padding: 2px 0; }
    .cover-wrap img { width: 100%; max-height: 31vh; aspect-ratio: 1 / 1; object-fit: contain; display: block; margin: 0 auto; border: none; }
    
    @media (orientation: landscape) {
      .stage-grid { grid-template-columns: 1fr 1fr; gap: 28px; }
      .cover-wrap img { max-height: 46vh; }
    }
    
    .help-box { padding: 4px 0; }
    .box-header { font-size: 0.65rem; color: #666; text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 6px; font-weight: 500; }
    .help-option-item { font-size: 1.05rem; font-weight: 400; color: #eee; padding: 10px 0; border-bottom: 0.5px solid rgba(255,255,255,0.15); }
    .help-option-item:first-child { border-top: 0.5px solid rgba(255,255,255,0.15); }
    
    .bonus-box { padding: 14px 0; border-top: 0.5px solid rgba(255,255,255,0.3); border-bottom: 0.5px solid rgba(255,255,255,0.3); text-align: center; }
    .bonus-a { font-size: 1.35rem; font-weight: 600; color: #fff; letter-spacing: 0.01em; margin-top: 4px; }
    
    .score-footer { width: 100%; text-align: center; margin-top: 16px; padding-top: 12px; border-top: 0.5px solid rgba(255,255,255,0.15); }
    .total-points-large { font-size: 2.8rem; font-weight: 300; line-height: 1; color: #fff; letter-spacing: -0.03em; }
    .total-cards-small { font-size: 0.68rem; font-weight: 400; color: #666; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.14em; }
    
    .fh-overlay { position: fixed; inset: 0; background: #000; color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 9999; cursor: pointer; }
    .fh-title { font-size: 2.8rem; font-weight: 200; text-transform: uppercase; letter-spacing: 0.08em; line-height: 1.1; margin-bottom: 16px; border-bottom: 0.5px solid rgba(255,255,255,0.4); padding-bottom: 16px; }
    .fh-sub { font-size: 0.9rem; font-weight: 400; text-transform: uppercase; letter-spacing: 0.18em; color: #a7f3d0; }
    
    details.settings-drawer { width: 100%; max-width: 960px; background: #000; border-top: 0.5px solid rgba(255,255,255,0.15); padding: 10px 0 0 0; margin-top: 12px; color: #555; font-size: 0.72rem; }
    details.settings-drawer summary { cursor: pointer; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; list-style: none; display: flex; justify-content: space-between; align-items: center; }
    .drawer-content { margin-top: 12px; padding-top: 12px; border-top: 0.5px solid rgba(255,255,255,0.1); }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid rgba(255,255,255,0.1); color: #bbb; font-weight: 400; }
  </style>
</head>
<body>

  <div id="full-house-overlay" class="fh-overlay" onclick="dismissFullHouseNow()">
    <div class="fh-title">6 Point · Fuldt Hus</div>
    <div class="fh-sub">Fjern et kort fra bordet</div>
  </div>

  <div class="main-wrap">
    <button id="fullscreen-btn" class="btn-fs" onclick="enterFullscreenAndWakeLock()">Fuldskærm</button>

    <div id="auth-panel" class="panel">
      <label for="client-id">Spotify Client ID</label>
      <input type="text" id="client-id" placeholder="Indsæt dit Client ID her">
      <button class="btn btn-primary" onclick="loginWithSpotify()">Forbind med Spotify</button>
    </div>

    <div id="scanner-panel" class="panel" style="display: none;">
      <button class="btn btn-primary" id="scan-start-btn" style="margin-bottom: 12px;" onclick="initScannerFromTap()">Start scanner</button>
      <div id="reader"></div>
    </div>

    <div id="playback-panel" class="panel" style="display: none;">
      <div class="stage-grid">
        <div class="visual-column">
          <div id="blind-indicator" class="status-box">
            <div class="timer-readout" id="status-disc">10s</div>
            <p class="status-label" id="status-text">Lyt · Læg telefonen ned</p>
          </div>

          <div id="cover-container" class="cover-wrap">
            <img id="album-cover-img" src="" alt="Pladecover">
          </div>

          <button class="btn btn-talk" id="btn-talk-volume" onclick="toggleTalkVolume()">Dæmp lyden (20%)</button>

          <div class="score-section">
            <div class="score-bar-header">Point + scan næste</div>
            <div class="points-grid">
              <button class="btn-pt" onclick="recordScoreAndScan(0)">0</button>
              <button class="btn-pt" onclick="recordScoreAndScan(1)">1</button>
              <button class="btn-pt" onclick="recordScoreAndScan(2)">2</button>
              <button class="btn-pt" onclick="recordScoreAndScan(3)">3</button>
              <button class="btn-pt" onclick="recordScoreAndScan(4)">4</button>
              <button class="btn-pt" onclick="recordScoreAndScan(5)">5</button>
              <button class="btn-pt btn-pt-max" onclick="recordScoreAndScan(6)">6</button>
            </div>
          </div>
        </div>

        <div class="controls-column">
          <button class="btn btn-primary" id="btn-continue-play" style="display: none;" onclick="continuePlaying(false)">Spil videre nu</button>
          <button class="btn" id="btn-reveal-stage" onclick="openBonusStage()">Vis cover og bonus</button>
          <button class="btn" id="btn-get-help" style="display: none;" onclick="showHelp()">Få hjælp</button>

          <div id="help-options-box" class="help-box" style="display: none;">
            <div class="box-header">Svarmuligheder</div>
            <div id="help-options-list"></div>
          </div>

          <button class="btn btn-primary" id="btn-show-bonus" style="display: none;" onclick="revealBonus()">Vis svar</button>

          <div id="bonus-answer-box" class="bonus-box" style="display: none;">
            <div class="box-header">Korrekt svar</div>
            <div id="bonus-answer-text" class="bonus-a"></div>
          </div>
        </div>
      </div>

      <div class="score-footer">
        <div class="total-points-large" id="total-points-display">0</div>
        <div class="total-cards-small" id="total-cards-display">0 kort</div>
      </div>
    </div>
  </div>

  <details id="device-panel" class="settings-drawer" style="display: none;">
    <summary id="drawer-summary">Vælg højttaler ▾</summary>
    <div class="drawer-content">
      <label for="device-select">Aktiv højttaler</label>
      <select id="device-select" onchange="switchDevice()"></select>
      <button class="btn btn-small" onclick="loadDevices()">Opdater højttalere</button>
      <div class="toggle-row">
        <span>10s lyt + 20s tænkepause</span>
        <input type="checkbox" id="speed-mode-toggle" checked style="width: 20px; height: 20px;">
      </div>
      <button class="btn btn-small" style="margin-top: 12px;" onclick="resetGameScore()">Nulstil point (nyt spil)</button>
      <button class="btn btn-small" style="margin-top: 8px;" onclick="forceRelogin()">Log ind på Spotify på ny</button>
    </div>
  </details>

  <script>
    const STORAGE_KEY = "spotify_learn_music_client_id";
    const VERIFIER_KEY = "spotify_pkce_verifier";
    const TOKEN_KEY = "spotify_access_token";
    const REFRESH_KEY = "spotify_refresh_token";
    const EXPIRES_KEY = "spotify_token_expires_at";
    const DEVICE_KEY = "spotify_saved_device_id";
    const DEVICE_NAME_KEY = "spotify_saved_device_name";
    const SCORE_HISTORY_KEY = "spotify_game_score_history";

    let token = null;
    let html5QrCode = null;
    let isScanning = false;
    let speedTimer = null;
    let pauseTimer = null;
    let countdownInterval = null;
    let fullHouseTimer = null;
    let isTalkVolume = false;
    let normalVolume = 60;
    let wakeLockSentinel = null;
    let refreshPromise = null;
    let currentCorrectAnswer = "";
    let currentOptions = [];
    let currentCoverUrl = "";
    let scoreHistory = [];

    function loadScoreHistory() {
      try {
        const raw = localStorage.getItem(SCORE_HISTORY_KEY);
        scoreHistory = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(scoreHistory)) scoreHistory = [];
      } catch (e) {
        scoreHistory = [];
      }
      updateScoreUI();
    }

    function saveScoreHistory() {
      localStorage.setItem(SCORE_HISTORY_KEY, JSON.stringify(scoreHistory));
      updateScoreUI();
    }

    function updateScoreUI() {
      const cardsCount = scoreHistory.length;
      const totalPoints = scoreHistory.reduce((sum, pts) => sum + pts, 0);
      const ptsEl = document.getElementById("total-points-display");
      const cardsEl = document.getElementById("total-cards-display");
      if (ptsEl) ptsEl.textContent = totalPoints;
      if (cardsEl) cardsEl.textContent = `${cardsCount} kort`;
    }

    function resetGameScore() {
      if (!confirm("Vil du nulstille alle point og starte et nyt spil?")) return;
      scoreHistory = [];
      saveScoreHistory();
    }

    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + possible[x % possible.length], "");
    }

    async function sha256(plain) {
      return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(plain));
    }

    function base64encode(input) {
      return btoa(String.fromCharCode(...new Uint8Array(input))).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
    }

    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          if (!wakeLockSentinel) {
            wakeLockSentinel = await navigator.wakeLock.request('screen');
            wakeLockSentinel.addEventListener('release', () => {
              wakeLockSentinel = null;
            });
          }
        } catch (e) {}
      }
    }

    async function enterFullscreenAndWakeLock() {
      requestWakeLock();
      const docEl = document.documentElement;
      try {
        if (!document.fullscreenElement && docEl.requestFullscreen) {
          await docEl.requestFullscreen({ navigationUI: "hide" });
        } else if (!document.webkitFullscreenElement && docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
      } catch (e) {}
      updateFullscreenButton();
    }

    function updateFullscreenButton() {
      const btn = document.getElementById("fullscreen-btn");
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (isFs) {
        btn.classList.add("hidden");
      } else {
        btn.classList.remove("hidden");
      }
    }

    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("webkitfullscreenchange", updateFullscreenButton);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        requestWakeLock();
      }
    });

    function saveTokenData(data) {
      token = data.access_token;
      localStorage.setItem(TOKEN_KEY, data.access_token);
      if (data.refresh_token) {
        localStorage.setItem(REFRESH_KEY, data.refresh_token);
      }
      const expiresIn = data.expires_in || 3600;
      const expiresAt = Date.now() + (expiresIn * 1000);
      localStorage.setItem(EXPIRES_KEY, String(expiresAt));
    }

    async function refreshAccessToken() {
      if (refreshPromise) return refreshPromise;

      const refreshToken = localStorage.getItem(REFRESH_KEY);
      const clientId = localStorage.getItem(STORAGE_KEY);
      if (!refreshToken || !clientId) return false;

      refreshPromise = (async () => {
        try {
          const response = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              client_id: clientId,
              grant_type: 'refresh_token',
              refresh_token: refreshToken
            }),
          });
          const data = await response.json();
          if (data.access_token) {
            saveTokenData(data);
            return true;
          }
          return false;
        } catch (e) {
          return false;
        } finally {
          refreshPromise = null;
        }
      })();

      return refreshPromise;
    }

    async function ensureValidToken() {
      const expiresAt = Number(localStorage.getItem(EXPIRES_KEY) || 0);
      if (!token || Date.now() > expiresAt - 180000) {
        await refreshAccessToken();
      }
    }

    async function spotifyFetch(url, options = {}, retries = 2) {
      await ensureValidToken();
      const headers = Object.assign({}, options.headers || {}, {
        "Authorization": `Bearer ${token}`
      });
      const fetchOptions = Object.assign({}, options, { headers });

      try {
        const res = await fetch(url, fetchOptions);
        if (res.status === 401 && retries > 0) {
          const refreshed = await refreshAccessToken();
          if (refreshed) {
            return spotifyFetch(url, options, retries - 1);
          }
        }
        return res;
      } catch (err) {
        if (retries > 0) {
          await new Promise(r => setTimeout(r, 450));
          return spotifyFetch(url, options, retries - 1);
        }
        throw err;
      }
    }

    function showAppPanels() {
      document.getElementById("auth-panel").style.display = "none";
      document.getElementById("device-panel").style.display = "block";
      document.getElementById("scanner-panel").style.display = "block";
    }

    window.addEventListener("load", async () => {
      loadScoreHistory();

      const storedId = localStorage.getItem(STORAGE_KEY);
      if (storedId) document.getElementById("client-id").value = storedId;

      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      if (code && storedId) {
        const codeVerifier = localStorage.getItem(VERIFIER_KEY);
        const redirectUri = window.location.origin + window.location.pathname;

        const response = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            client_id: storedId,
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: redirectUri,
            code_verifier: codeVerifier,
          }),
        });

        const data = await response.json();
        if (data.access_token) {
          saveTokenData(data);
          window.history.replaceState({}, document.title, window.location.pathname);
          showAppPanels();
          loadDevices();
        } else {
          alert("Fejl ved login: " + (data.error_description || data.error));
        }
        return;
      }

      const savedToken = localStorage.getItem(TOKEN_KEY);
      const savedRefresh = localStorage.getItem(REFRESH_KEY);
      if (savedToken || savedRefresh) {
        token = savedToken;
        await ensureValidToken();
        if (token) {
          showAppPanels();
          loadDevices();
        }
      }
    });

    setInterval(async () => {
      if (!token && !localStorage.getItem(REFRESH_KEY)) return;
      await ensureValidToken();
      if (token) {
        try {
          await spotifyFetch("https://api.spotify.com/v1/me/player", {}, 1);
        } catch (e) {}
      }
    }, 180000);

    async function loginWithSpotify() {
      const clientId = document.getElementById("client-id").value.trim();
      if (!clientId) return alert("Indtast dit Spotify Client ID først.");
      localStorage.setItem(STORAGE_KEY, clientId);

      const codeVerifier = generateRandomString(64);
      localStorage.setItem(VERIFIER_KEY, codeVerifier);
      const codeChallenge = base64encode(await sha256(codeVerifier));
      const redirectUri = window.location.origin + window.location.pathname;
      const scopes = "streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state";

      const authUrl = new URL("https://accounts.spotify.com/authorize");
      authUrl.search = new URLSearchParams({
        response_type: 'code',
        client_id: clientId,
        scope: scopes,
        code_challenge_method: 'S256',
        code_challenge: codeChallenge,
        redirect_uri: redirectUri,
      }).toString();

      window.location.href = authUrl.toString();
    }

    function forceRelogin() {
      localStorage.removeItem(TOKEN_KEY);
      localStorage.removeItem(REFRESH_KEY);
      localStorage.removeItem(EXPIRES_KEY);
      loginWithSpotify();
    }

    function updateSummary() {
      const select = document.getElementById("device-select");
      const summary = document.getElementById("drawer-summary");
      if (select.selectedIndex >= 0 && select.options[select.selectedIndex].value) {
        const chosenText = select.options[select.selectedIndex].textContent;
        summary.textContent = "Højttaler: " + chosenText + " ▾";
        localStorage.setItem(DEVICE_KEY, select.value);
        localStorage.setItem(DEVICE_NAME_KEY, chosenText);
      }
    }

    async function switchDevice() {
      updateSummary();
      const selectedDeviceId = document.getElementById("device-select").value;
      if (!token || !selectedDeviceId) return;

      await spotifyFetch("https://api.spotify.com/v1/me/player", {
        method: "PUT",
        body: JSON.stringify({ device_ids: [selectedDeviceId], play: false }),
        headers: { "Content-Type": "application/json" }
      });
    }

    async function loadDevices() {
      if (!token) return;
      const res = await spotifyFetch("https://api.spotify.com/v1/me/player/devices");
      if (!res || !res.ok) return;

      const data = await res.json();
      const select = document.getElementById("device-select");
      const savedDeviceId = select.value || localStorage.getItem(DEVICE_KEY);
      const savedDeviceName = localStorage.getItem(DEVICE_NAME_KEY);
      select.innerHTML = "";

      if (data.devices && data.devices.length > 0) {
        data.devices.forEach(dev => {
          const opt = document.createElement("option");
          opt.value = dev.id;
          opt.textContent = `${dev.name} (${dev.type})`;
          if (dev.is_active) {
            opt.selected = true;
            if (typeof dev.volume_percent === "number" && dev.volume_percent > 20) {
              normalVolume = dev.volume_percent;
            }
          }
          select.appendChild(opt);
        });

        if (savedDeviceId) {
          const exists = Array.from(select.options).some(o => o.value === savedDeviceId);
          if (exists) {
            select.value = savedDeviceId;
          } else if (savedDeviceName) {
            const savedOpt = document.createElement("option");
            savedOpt.value = savedDeviceId;
            savedOpt.textContent = savedDeviceName;
            savedOpt.selected = true;
            select.appendChild(savedOpt);
          }
        }
        updateSummary();
      } else if (savedDeviceId && savedDeviceName) {
        const savedOpt = document.createElement("option");
        savedOpt.value = savedDeviceId;
        savedOpt.textContent = savedDeviceName;
        savedOpt.selected = true;
        select.appendChild(savedOpt);
        updateSummary();
      } else {
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "Ingen aktive enheder fundet";
        select.appendChild(opt);
        document.getElementById("device-panel").open = true;
      }
    }

    async function syncNormalVolume() {
      if (!token) return;
      try {
        const res = await spotifyFetch("https://api.spotify.com/v1/me/player", {}, 1);
        if (res && res.status === 200) {
          const state = await res.json();
          if (state && state.device && typeof state.device.volume_percent === "number") {
            const currentVol = state.device.volume_percent;
            if (!isTalkVolume && currentVol > 20) {
              normalVolume = currentVol;
            } else if (isTalkVolume && currentVol > 25) {
              normalVolume = currentVol;
              setTalkVolumeUI(false);
            }
          }
        }
      } catch (e) {}
    }

    async function setSpotifyVolume(vol) {
      const selectedDeviceId = document.getElementById("device-select").value;
      if (!token || !selectedDeviceId) return;
      await spotifyFetch(`https://api.spotify.com/v1/me/player/volume?volume_percent=${vol}&device_id=${selectedDeviceId}`, {
        method: "PUT"
      });
    }

    function setTalkVolumeUI(active) {
      const btn = document.getElementById("btn-talk-volume");
      isTalkVolume = active;
      if (active) {
        btn.textContent = "Skru op på normal lyd";
        btn.classList.add("active");
      } else {
        btn.textContent = "Dæmp lyden (20%)";
        btn.classList.remove("active");
      }
    }

    async function toggleTalkVolume() {
      enterFullscreenAndWakeLock();
      if (!isTalkVolume) {
        await syncNormalVolume();
        await setSpotifyVolume(20);
        setTalkVolumeUI(true);
      } else {
        await setSpotifyVolume(normalVolume);
        setTalkVolumeUI(false);
      }
    }

    function initScannerFromTap() {
      enterFullscreenAndWakeLock();
      startScanner();
    }

    function startScanner() {
      if (isScanning) return;
      document.getElementById("playback-panel").style.display = "none";
      document.getElementById("scanner-panel").style.display = "block";
      document.getElementById("scan-start-btn").style.display = "none";

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          stopScannerAndPlay(decodedText);
        },
        () => {}
      ).then(() => {
        isScanning = true;
      }).catch(err => {
        document.getElementById("scan-start-btn").style.display = "block";
        alert("Kunne ikke starte kamera: " + err);
      });
    }

    function stopScannerAndPlay(decodedText) {
      if (html5QrCode && isScanning) {
        isScanning = false;
        html5QrCode.stop().then(() => {
          document.getElementById("scanner-panel").style.display = "none";
          handleScannedCode(decodedText);
        }).catch(() => {
          document.getElementById("scanner-panel").style.display = "none";
          handleScannedCode(decodedText);
        });
      }
    }

    function parseQrPayload(raw) {
      const parts = raw.split("|").map(s => s.trim());
      if (parts.length < 4) {
        return { trackId: null, correctAnswer: null, options: [] };
      }

      const trackPart = parts[0];
      const correctAnswer = parts[1];
      const options = [parts[1], parts[2], parts[3]];

      let trackId = null;
      if (trackPart.startsWith("spotify:track:")) {
        trackId = trackPart.split(":")[2].split("?")[0];
      } else {
        const urlMatch = trackPart.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?track\/([a-zA-Z0-9]+)/);
        if (urlMatch) trackId = urlMatch[1];
        else if (/^[a-zA-Z0-9]{22}$/.test(trackPart)) trackId = trackPart;
      }
      return { trackId, correctAnswer, options };
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }
      return copy;
    }

    function clearTimers() {
      if (speedTimer) clearTimeout(speedTimer);
      if (pauseTimer) clearTimeout(pauseTimer);
      if (countdownInterval) clearInterval(countdownInterval);
    }

    async function fetchTrackCover(trackId) {
      currentCoverUrl = "";
      const imgEl = document.getElementById("album-cover-img");
      imgEl.src = "";
      try {
        const res = await spotifyFetch(`https://api.spotify.com/v1/tracks/${trackId}`);
        if (res && res.ok) {
          const data = await res.json();
          if (data.album && data.album.images && data.album.images.length > 0) {
            currentCoverUrl = data.album.images[0].url;
            imgEl.src = currentCoverUrl;
          }
        }
      } catch (e) {}
    }

    async function playTrackWithWakeup(selectedDeviceId, trackId) {
      const playUrl = `https://api.spotify.com/v1/me/player/play?device_id=${selectedDeviceId}`;
      const payload = {
        method: "PUT",
        body: JSON.stringify({ uris: [`spotify:track:${trackId}`] }),
        headers: { "Content-Type": "application/json" }
      };

      let res = await spotifyFetch(playUrl, payload);
      if (!res || !res.ok) {
        await spotifyFetch("https://api.spotify.com/v1/me/player", {
          method: "PUT",
          body: JSON.stringify({ device_ids: [selectedDeviceId], play: false }),
          headers: { "Content-Type": "application/json" }
        });
        await new Promise(r => setTimeout(r, 500));
        await spotifyFetch(playUrl, payload);
      }
    }

    async function handleScannedCode(code) {
      clearTimers();
      const { trackId, correctAnswer, options } = parseQrPayload(code);
      if (!trackId || !correctAnswer || options.length < 3) {
        alert("Ugyldig QR-kode");
        startScanner();
        return;
      }

      const selectedDeviceId = document.getElementById("device-select").value || localStorage.getItem(DEVICE_KEY);
      if (!selectedDeviceId) {
        document.getElementById("device-panel").open = true;
        alert("Vælg en højttaler på listen nederst først.");
        startScanner();
        return;
      }

      currentCorrectAnswer = correctAnswer;
      currentOptions = options;
      fetchTrackCover(trackId);

      await syncNormalVolume();
      if (isTalkVolume) {
        await setSpotifyVolume(normalVolume);
        setTalkVolumeUI(false);
      }

      const speedMode = document.getElementById("speed-mode-toggle").checked;
      const indicatorBox = document.getElementById("blind-indicator");
      const disc = document.getElementById("status-disc");
      const statusText = document.getElementById("status-text");

      document.getElementById("playback-panel").style.display = "block";
      indicatorBox.style.display = "block";
      indicatorBox.classList.remove("paused");
      document.getElementById("cover-container").style.display = "none";
      document.getElementById("help-options-box").style.display = "none";
      document.getElementById("help-options-list").innerHTML = "";
      document.getElementById("bonus-answer-box").style.display = "none";
      document.getElementById("bonus-answer-text").textContent = currentCorrectAnswer;

      document.getElementById("btn-reveal-stage").style.display = "block";
      document.getElementById("btn-get-help").style.display = "none";
      document.getElementById("btn-show-bonus").style.display = "none";
      document.getElementById("btn-continue-play").style.display = "none";

      await playTrackWithWakeup(selectedDeviceId, trackId);

      if (speedMode) {
        let secondsLeft = 10;
        disc.textContent = "10s";
        statusText.textContent = "Lyt · Læg telefonen ned";

        countdownInterval = setInterval(() => {
          secondsLeft--;
          if (secondsLeft > 0) disc.textContent = secondsLeft + "s";
        }, 1000);

        speedTimer = setTimeout(async () => {
          clearInterval(countdownInterval);
          await syncNormalVolume();
          await spotifyFetch(`https://api.spotify.com/v1/me/player/pause?device_id=${selectedDeviceId}`, {
            method: "PUT"
          });

          let pauseSeconds = 20;
          disc.textContent = "20s";
          indicatorBox.classList.add("paused");
          statusText.textContent = "Placér kortet inden lyden starter";
          document.getElementById("btn-continue-play").style.display = "block";

          countdownInterval = setInterval(() => {
            pauseSeconds--;
            if (pauseSeconds > 0) disc.textContent = pauseSeconds + "s";
          }, 1000);

          pauseTimer = setTimeout(() => {
            continuePlaying(true);
          }, 20000);
        }, 10000);
      } else {
        disc.textContent = "LYT";
        statusText.textContent = "Sangen spiller";
      }
    }

    async function continuePlaying(autoStarted = false) {
      clearTimers();
      if (!autoStarted) enterFullscreenAndWakeLock();

      const selectedDeviceId = document.getElementById("device-select").value || localStorage.getItem(DEVICE_KEY);

      await syncNormalVolume();
      if (isTalkVolume) {
        await setSpotifyVolume(normalVolume);
        setTalkVolumeUI(false);
      }

      await spotifyFetch(`https://api.spotify.com/v1/me/player/play?device_id=${selectedDeviceId}`, {
        method: "PUT"
      });

      const indicatorBox = document.getElementById("blind-indicator");
      const disc = document.getElementById("status-disc");
      disc.textContent = "LYT";
      indicatorBox.classList.remove("paused");
      document.getElementById("status-text").textContent = autoStarted
        ? "20 sek gået · Spiller videre"
        : "Spiller videre";
      document.getElementById("btn-continue-play").style.display = "none";
    }

    function openBonusStage() {
      enterFullscreenAndWakeLock();
      document.getElementById("blind-indicator").style.display = "none";
      if (currentCoverUrl) {
        document.getElementById("cover-container").style.display = "block";
      }
      document.getElementById("btn-reveal-stage").style.display = "none";
      document.getElementById("btn-get-help").style.display = "block";
      document.getElementById("btn-show-bonus").style.display = "block";
    }

    function showHelp() {
      enterFullscreenAndWakeLock();
      const shuffled = shuffleArray(currentOptions);
      const listEl = document.getElementById("help-options-list");
      listEl.innerHTML = "";

      shuffled.forEach(optionText => {
        const div = document.createElement("div");
        div.className = "help-option-item";
        div.textContent = optionText;
        listEl.appendChild(div);
      });

      document.getElementById("help-options-box").style.display = "block";
      document.getElementById("btn-get-help").style.display = "none";
    }

    function revealBonus() {
      enterFullscreenAndWakeLock();
      document.getElementById("bonus-answer-box").style.display = "block";
      document.getElementById("btn-show-bonus").style.display = "none";
      document.getElementById("btn-get-help").style.display = "none";
    }

    function dismissFullHouseNow() {
      if (fullHouseTimer) {
        clearTimeout(fullHouseTimer);
        fullHouseTimer = null;
      }
      document.getElementById("full-house-overlay").style.display = "none";
      startScanner();
    }

    async function recordScoreAndScan(points) {
      enterFullscreenAndWakeLock();
      clearTimers();

      scoreHistory.push(points);
      saveScoreHistory();

      const selectedDeviceId = document.getElementById("device-select").value || localStorage.getItem(DEVICE_KEY);
      if (selectedDeviceId) {
        spotifyFetch(`https://api.spotify.com/v1/me/player/pause?device_id=${selectedDeviceId}`, {
          method: "PUT"
        });
      }

      document.getElementById("playback-panel").style.display = "none";

      if (points === 6) {
        const overlay = document.getElementById("full-house-overlay");
        overlay.style.display = "flex";
        fullHouseTimer = setTimeout(() => {
          dismissFullHouseNow();
        }, 1800);
      } else {
        startScanner();
      }
    }
  </script>
</body>
</html>
