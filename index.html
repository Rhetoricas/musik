<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Music</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px 16px; }
    h1 { font-size: 1.5rem; margin-bottom: 12px; font-weight: 700; text-align: center; }
    .card { background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 12px; padding: 18px; width: 100%; max-width: 480px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .btn { background: #1db954; color: #000; border: none; padding: 12px 20px; font-size: 1rem; font-weight: 700; border-radius: 24px; cursor: pointer; width: 100%; transition: opacity 0.15s ease; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: #333; color: #fff; margin-top: 12px; }
    .btn-small { background: #2a2a2a; color: #ccc; font-size: 0.85rem; padding: 8px 12px; border-radius: 8px; margin-top: 8px; font-weight: 600; }
    .btn-reveal { background: #ff7900; color: #fff; font-size: 1.15rem; padding: 15px; margin-top: 14px; }
    .btn-bonus { background: #8e44ad; color: #fff; font-size: 1.15rem; padding: 15px; margin-top: 12px; }
    input[type="text"], select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 0.95rem; margin-top: 8px; margin-bottom: 8px; }
    label { font-size: 0.85rem; color: #aaa; display: block; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; margin-top: 10px; }
    .pulse-disc { width: 110px; height: 110px; border-radius: 50%; background: #1db954; margin: 20px auto; animation: pulse 1.6s infinite ease-in-out; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; }
    @keyframes pulse {
      0% { transform: scale(0.92); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(0.92); opacity: 0.7; }
    }
    .track-details { text-align: center; margin-top: 16px; padding-top: 16px; border-top: 1px solid #2a2a2a; animation: fadeIn 0.3s ease forwards; }
    .track-details img { width: 180px; height: 180px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.6); margin-bottom: 10px; }
    .track-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
    .track-artist { font-size: 1rem; color: #b3b3b3; }
    .bonus-box { background: #26172c; border: 1px solid #6c3483; border-radius: 10px; padding: 14px; margin-top: 12px; text-align: center; animation: fadeIn 0.3s ease forwards; }
    .bonus-q { font-size: 0.95rem; color: #d2b4de; margin-bottom: 8px; font-weight: 600; }
    .bonus-a { font-size: 1.2rem; color: #fff; font-weight: 700; }
    .status-text { font-size: 0.85rem; color: #888; text-align: center; margin-top: 8px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <h1>Learn Music</h1>

  <div id="auth-panel" class="card">
    <label for="client-id">Spotify Client ID</label>
    <input type="text" id="client-id" placeholder="Indsæt dit Client ID her">
    <button class="btn" onclick="loginWithSpotify()">Forbind med Spotify</button>
    <div class="status-text" id="auth-status">Log ind for at starte afspilleren</div>
  </div>

  <div id="device-panel" class="card" style="display: none;">
    <label for="device-select">Vælg afspilningsenhed (højttaler)</label>
    <select id="device-select"></select>
    <button class="btn btn-small" onclick="loadDevices()">Opdater liste over højttalere</button>
  </div>

  <div id="scanner-panel" class="card" style="display: none;">
    <button class="btn" id="scan-toggle-btn" onclick="toggleScanner()">Tænd QR Scanner</button>
    <div id="reader"></div>
  </div>

  <div id="playback-panel" class="card" style="display: none;">
    <div id="blind-indicator">
      <div class="pulse-disc">🎵</div>
      <p style="text-align: center; font-weight: 600;">Sangen spiller... Læg telefonen ned!</p>
    </div>

    <!-- Valgfrit bonusspørgsmål hvis det også ligger i QR-koden -->
    <div id="bonus-question-box" class="bonus-box" style="display: none;">
      <div id="bonus-question-text" class="bonus-q"></div>
    </div>

    <!-- Knap til at vise bonussvar (vises kun hvis QR-koden har bonusdata) -->
    <button class="btn btn-bonus" id="btn-show-bonus" style="display: none;" onclick="revealBonus()">Vis bonussvar</button>

    <!-- Bonussvaret -->
    <div id="bonus-answer-box" class="bonus-box" style="display: none;">
      <div style="font-size: 0.8rem; color: #b39ddb; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px;">Bonussvar</div>
      <div id="bonus-answer-text" class="bonus-a"></div>
    </div>

    <!-- Knap til at afsløre selve sangen på skærmen -->
    <button class="btn btn-reveal" id="btn-show-track" onclick="revealTrack()">Afslør sang på skærm</button>

    <div id="revealed-view" class="track-details" style="display: none;">
      <img id="track-cover" src="" alt="Album cover">
      <div id="track-name" class="track-title"></div>
      <div id="track-artist" class="track-artist"></div>
    </div>

    <button class="btn btn-secondary" onclick="resetForNextSong()">Scan næste kort</button>
  </div>

  <script>
    const STORAGE_KEY = "spotify_learn_music_client_id";
    const VERIFIER_KEY = "spotify_pkce_verifier";
    let token = null;
    let player = null;
    let webPlayerDeviceId = null;
    let html5QrCode = null;
    let isScanning = false;
    let currentTrackInfo = null;

    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + possible[x % possible.length], "");
    }

    async function sha256(plain) {
      const encoder = new TextEncoder();
      const data = encoder.encode(plain);
      return window.crypto.subtle.digest('SHA-256', data);
    }

    function base64encode(input) {
      return btoa(String.fromCharCode(...new Uint8Array(input)))
        .replace(/=/g, '')
        .replace(/\+/g, '-')
        .replace(/\//g, '_');
    }

    window.addEventListener("load", async () => {
      const storedId = localStorage.getItem(STORAGE_KEY);
      if (storedId) document.getElementById("client-id").value = storedId;

      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      if (code && storedId) {
        const codeVerifier = localStorage.getItem(VERIFIER_KEY);
        const redirectUri = window.location.origin + window.location.pathname;

        try {
          const response = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              client_id: storedId,
              grant_type: 'authorization_code',
              code: code,
              redirect_uri: redirectUri,
              code_verifier: codeVerifier,
            }),
          });

          const data = await response.json();
          if (data.access_token) {
            token = data.access_token;
            window.history.replaceState({}, document.title, window.location.pathname);
            document.getElementById("auth-panel").style.display = "none";
            document.getElementById("device-panel").style.display = "block";
            document.getElementById("scanner-panel").style.display = "block";
            initSpotifyPlayer();
            loadDevices();
          } else {
            alert("Fejl ved login: " + (data.error_description || data.error));
          }
        } catch (err) {
          alert("Netværksfejl ved token-udveksling: " + err);
        }
      }
    });

    async function loginWithSpotify() {
      const clientId = document.getElementById("client-id").value.trim();
      if (!clientId) {
        alert("Indtast dit Spotify Client ID først.");
        return;
      }
      localStorage.setItem(STORAGE_KEY, clientId);

      const codeVerifier = generateRandomString(64);
      localStorage.setItem(VERIFIER_KEY, codeVerifier);

      const hashed = await sha256(codeVerifier);
      const codeChallenge = base64encode(hashed);

      const redirectUri = window.location.origin + window.location.pathname;
      const scopes = "streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state";

      const authUrl = new URL("https://accounts.spotify.com/authorize");
      authUrl.search = new URLSearchParams({
        response_type: 'code',
        client_id: clientId,
        scope: scopes,
        code_challenge_method: 'S256',
        code_challenge: codeChallenge,
        redirect_uri: redirectUri,
      }).toString();

      window.location.href = authUrl.toString();
    }

    window.onSpotifyWebPlaybackSDKReady = () => {
      if (token) initSpotifyPlayer();
    };

    function initSpotifyPlayer() {
      if (!token || player || !window.Spotify) return;

      player = new Spotify.Player({
        name: 'Learn Music (Denne browser)',
        getOAuthToken: cb => { cb(token); },
        volume: 0.8
      });

      player.addListener('ready', ({ device_id }) => {
        webPlayerDeviceId = device_id;
        loadDevices();
      });

      player.connect();
    }

    async function loadDevices() {
      if (!token) return;
      try {
        const res = await fetch("https://api.spotify.com/v1/me/player/devices", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        const select = document.getElementById("device-select");
        const previousValue = select.value;
        select.innerHTML = "";

        if (data.devices && data.devices.length > 0) {
          data.devices.forEach(dev => {
            const opt = document.createElement("option");
            opt.value = dev.id;
            opt.textContent = `${dev.name} (${dev.type})`;
            if (dev.is_active) opt.selected = true;
            select.appendChild(opt);
          });
          if (previousValue && Array.from(select.options).some(o => o.value === previousValue)) {
            select.value = previousValue;
          }
        } else if (webPlayerDeviceId) {
          const opt = document.createElement("option");
          opt.value = webPlayerDeviceId;
          opt.textContent = "Learn Music (Denne browser)";
          select.appendChild(opt);
        } else {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "Ingen aktive enheder fundet - åbn Spotify på din højttaler";
          select.appendChild(opt);
        }
      } catch (e) {
        console.error("Kunne ikke hente enheder:", e);
      }
    }

    function toggleScanner() {
      if (isScanning) {
        stopScanner();
      } else {
        startScanner();
      }
    }

    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          handleScannedCode(decodedText);
          stopScanner();
        },
        () => {}
      ).then(() => {
        isScanning = true;
        document.getElementById("scan-toggle-btn").textContent = "Stop scanner";
      }).catch(err => {
        alert("Kunne ikke starte kamera: " + err);
      });
    }

    function stopScanner() {
      if (html5QrCode && isScanning) {
        html5QrCode.stop().then(() => {
          isScanning = false;
          document.getElementById("scan-toggle-btn").textContent = "Tænd QR Scanner";
        });
      }
    }

    function parseQrPayload(raw) {
      // Understøtter formatet: <spotify-link>|<bonussvar> eller <spotify-link>|<spørgsmål>|<svar>
      const parts = raw.split("|").map(s => s.trim());
      const trackPart = parts[0];
      let bonusQuestion = null;
      let bonusAnswer = null;

      if (parts.length === 2) {
        bonusAnswer = parts[1];
      } else if (parts.length >= 3) {
        bonusQuestion = parts[1];
        bonusAnswer = parts.slice(2).join(" | ");
      }

      // Tjek også om der er brugt URL-parameter ?bonus=...
      if (!bonusAnswer && trackPart.includes("?")) {
        try {
          const urlObj = new URL(trackPart);
          bonusQuestion = urlObj.searchParams.get("q");
          bonusAnswer = urlObj.searchParams.get("bonus") || urlObj.searchParams.get("a");
        } catch (e) {}
      }

      let trackId = null;
      if (trackPart.startsWith("spotify:track:")) {
        trackId = trackPart.split(":")[2].split("?")[0];
      } else {
        const urlMatch = trackPart.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?track\/([a-zA-Z0-9]+)/);
        if (urlMatch) trackId = urlMatch[1];
        else if (/^[a-zA-Z0-9]{22}$/.test(trackPart)) trackId = trackPart;
      }

      return { trackId, bonusQuestion, bonusAnswer };
    }

    async function handleScannedCode(code) {
      const { trackId, bonusQuestion, bonusAnswer } = parseQrPayload(code);

      if (!trackId) {
        alert("Ikke en gyldig Spotify sang-kode: " + code);
        return;
      }

      const selectedDeviceId = document.getElementById("device-select").value || webPlayerDeviceId;
      if (!selectedDeviceId) {
        alert("Vælg en højttaler/enhed på listen først (tryk evt. 'Opdater liste').");
        return;
      }

      // Nulstil visning
      document.getElementById("playback-panel").style.display = "block";
      document.getElementById("blind-indicator").style.display = "block";
      document.getElementById("revealed-view").style.display = "none";
      document.getElementById("btn-show-track").style.display = "block";
      document.getElementById("bonus-answer-box").style.display = "none";

      // Håndter bonusspørgsmål og knap
      if (bonusQuestion) {
        document.getElementById("bonus-question-text").textContent = "Bonus: " + bonusQuestion;
        document.getElementById("bonus-question-box").style.display = "block";
      } else {
        document.getElementById("bonus-question-box").style.display = "none";
      }

      if (bonusAnswer) {
        document.getElementById("bonus-answer-text").textContent = bonusAnswer;
        document.getElementById("btn-show-bonus").style.display = "block";
      } else {
        document.getElementById("btn-show-bonus").style.display = "none";
      }

      // Hent sang-info i baggrunden
      fetch(`https://api.spotify.com/v1/tracks/${trackId}`, {
        headers: { "Authorization": `Bearer ${token}` }
      })
      .then(res => res.json())
      .then(track => {
        currentTrackInfo = {
          name: track.name,
          artist: track.artists.map(a => a.name).join(", "),
          cover: track.album.images[0]?.url || ""
        };
      });

      // Start sangen på valgt højttaler
      await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${selectedDeviceId}`, {
        method: "PUT",
        body: JSON.stringify({ uris: [`spotify:track:${trackId}`] }),
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        }
      });
    }

    function revealBonus() {
      document.getElementById("bonus-answer-box").style.display = "block";
      document.getElementById("btn-show-bonus").style.display = "none";
    }

    function revealTrack() {
      if (!currentTrackInfo) return;
      document.getElementById("track-cover").src = currentTrackInfo.cover;
      document.getElementById("track-name").textContent = currentTrackInfo.name;
      document.getElementById("track-artist").textContent = currentTrackInfo.artist;

      document.getElementById("revealed-view").style.display = "block";
      document.getElementById("btn-show-track").style.display = "none";
    }

    async function resetForNextSong() {
      const selectedDeviceId = document.getElementById("device-select").value || webPlayerDeviceId;
      if (selectedDeviceId) {
        await fetch(`https://api.spotify.com/v1/me/player/pause?device_id=${selectedDeviceId}`, {
          method: "PUT",
          headers: { "Authorization": `Bearer ${token}` }
        });
      }
      document.getElementById("playback-panel").style.display = "none";
      startScanner();
    }
  </script>
</body>
</html>
