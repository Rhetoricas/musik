<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Music</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 24px 16px; }
    
    .main-wrap { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: 1.35rem; margin-bottom: 18px; font-weight: 700; color: #e0e0e0; letter-spacing: 0.5px; }
    
    .card { background: #1a1a1a; border: 1px solid #282828; border-radius: 16px; padding: 20px; width: 100%; margin-bottom: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
    
    .btn { background: #1db954; color: #000; border: none; padding: 15px 20px; font-size: 1.05rem; font-weight: 700; border-radius: 30px; cursor: pointer; width: 100%; }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: #2c2c2c; color: #fff; margin-top: 14px; }
    .btn-small { background: #2a2a2a; color: #ccc; font-size: 0.85rem; padding: 10px 12px; border-radius: 8px; margin-top: 8px; font-weight: 600; }
    .btn-continue { background: #29b6f6; color: #000; font-size: 1.1rem; padding: 16px; margin-top: 14px; }
    .btn-bonus { background: #8e44ad; color: #fff; font-size: 1.1rem; padding: 16px; margin-top: 14px; }
    
    input[type="text"], select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #242424; color: #fff; font-size: 0.95rem; margin-top: 6px; margin-bottom: 8px; }
    label { font-size: 0.85rem; color: #999; display: block; }
    
    #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; margin-top: 12px; }
    
    .pulse-disc { width: 104px; height: 104px; border-radius: 50%; background: #1db954; margin: 12px auto 18px; animation: pulse 1.6s infinite ease-in-out; display: flex; align-items: center; justify-content: center; font-size: 1.9rem; font-weight: 800; color: #000; }
    .pulse-disc.paused { background: #f39c12; animation: none; }
    @keyframes pulse {
      0% { transform: scale(0.92); opacity: 0.7; }
      50% { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(0.92); opacity: 0.7; }
    }
    
    .bonus-box { background: #231628; border: 1px solid #6c3483; border-radius: 12px; padding: 16px; margin-top: 14px; text-align: center; }
    .bonus-a { font-size: 1.25rem; color: #fff; font-weight: 700; }

    details.settings-drawer { width: 100%; max-width: 440px; background: #161616; border: 1px solid #262626; border-radius: 12px; padding: 12px 16px; margin-top: 24px; color: #888; font-size: 0.9rem; }
    details.settings-drawer summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    details.settings-drawer summary::-webkit-details-marker { display: none; }
    details.settings-drawer summary::after { content: "▾"; font-size: 1rem; color: #666; }
    details.settings-drawer[open] summary::after { content: "▴"; }
    .drawer-content { margin-top: 14px; padding-top: 14px; border-top: 1px solid #262626; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid #222; font-size: 0.9rem; color: #ccc; }
    .btn-row { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <div class="main-wrap">
    <h1>Learn Music</h1>

    <div id="auth-panel" class="card">
      <label for="client-id">Spotify Client ID</label>
      <input type="text" id="client-id" placeholder="Indsæt dit Client ID her">
      <button class="btn" onclick="loginWithSpotify()">Forbind med Spotify</button>
    </div>

    <div id="scanner-panel" class="card" style="display: none;">
      <button class="btn" id="scan-toggle-btn" onclick="toggleScanner()">Scan kort</button>
      <div id="reader"></div>
    </div>

    <div id="playback-panel" class="card" style="display: none;">
      <div id="blind-indicator">
        <div class="pulse-disc" id="status-disc">10s</div>
        <p id="status-text" style="text-align: center; font-weight: 600; color: #ddd;">Læg telefonen ned</p>
      </div>

      <button class="btn btn-continue" id="btn-continue-play" style="display: none;" onclick="continuePlaying()">Spil videre</button>
      <button class="btn btn-bonus" id="btn-show-bonus" style="display: none;" onclick="revealBonus()">Vis bonussvar</button>

      <div id="bonus-answer-box" class="bonus-box" style="display: none;">
        <div style="font-size: 0.72rem; color: #b39ddb; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px;">Bonussvar</div>
        <div id="bonus-answer-text" class="bonus-a"></div>
      </div>

      <button class="btn btn-secondary" onclick="resetForNextSong()">Scan næste kort</button>
    </div>
  </div>

  <details id="device-panel" class="settings-drawer" style="display: none;">
    <summary id="drawer-summary">Højttaler & indstillinger</summary>
    <div class="drawer-content">
      <label for="device-select">Aktiv højttaler</label>
      <select id="device-select" onchange="updateSummaryLabel()"></select>
      <div class="btn-row">
        <button class="btn btn-small" onclick="loadDevices()">Opdater liste</button>
        <button class="btn btn-small" style="background:#1db954; color:#000;" onclick="testAudio()">Test lyd (Take On Me)</button>
      </div>
      <div class="toggle-row">
        <span>10-sekunders auto-pause</span>
        <input type="checkbox" id="speed-mode-toggle" checked style="width: 20px; height: 20px;">
      </div>
    </div>
  </details>

  <script>
    const STORAGE_KEY = "spotify_learn_music_client_id";
    const VERIFIER_KEY = "spotify_pkce_verifier";
    let token = null;
    let player = null;
    let webPlayerDeviceId = null;
    let html5QrCode = null;
    let isScanning = false;
    let speedTimer = null;
    let countdownInterval = null;

    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + possible[x % possible.length], "");
    }

    async function sha256(plain) {
      const encoder = new TextEncoder();
      return window.crypto.subtle.digest('SHA-256', encoder.encode(plain));
    }

    function base64encode(input) {
      return btoa(String.fromCharCode(...new Uint8Array(input))).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
    }

    window.addEventListener("load", async () => {
      const storedId = localStorage.getItem(STORAGE_KEY);
      if (storedId) document.getElementById("client-id").value = storedId;

      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      if (code && storedId) {
        const codeVerifier = localStorage.getItem(VERIFIER_KEY);
        const redirectUri = window.location.origin + window.location.pathname;

        try {
          const response = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              client_id: storedId,
              grant_type: 'authorization_code',
              code: code,
              redirect_uri: redirectUri,
              code_verifier: codeVerifier,
            }),
          });

          const data = await response.json();
          if (data.access_token) {
            token = data.access_token;
            window.history.replaceState({}, document.title, window.location.pathname);
            document.getElementById("auth-panel").style.display = "none";
            document.getElementById("scanner-panel").style.display = "block";
            document.getElementById("device-panel").style.display = "block";
            initSpotifyPlayer();
            loadDevices();
          }
        } catch (err) {
          alert("Login fejl: " + err);
        }
      }
    });

    async function loginWithSpotify() {
      const clientId = document.getElementById("client-id").value.trim();
      if (!clientId) return alert("Indtast dit Spotify Client ID først.");
      localStorage.setItem(STORAGE_KEY, clientId);

      const codeVerifier = generateRandomString(64);
      localStorage.setItem(VERIFIER_KEY, codeVerifier);
      const codeChallenge = base64encode(await sha256(codeVerifier));
      const redirectUri = window.location.origin + window.location.pathname;
      const scopes = "streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state";

      const authUrl = new URL("https://accounts.spotify.com/authorize");
      authUrl.search = new URLSearchParams({
        response_type: 'code', client_id: clientId, scope: scopes,
        code_challenge_method: 'S256', code_challenge: codeChallenge, redirect_uri: redirectUri,
      }).toString();
      window.location.href = authUrl.toString();
    }

    window.onSpotifyWebPlaybackSDKReady = () => { if (token) initSpotifyPlayer(); };

    function initSpotifyPlayer() {
      if (!token || player || !window.Spotify) return;
      player = new Spotify.Player({
        name: 'Learn Music (Denne browser)',
        getOAuthToken: cb => { cb(token); },
        volume: 1.0
      });
      player.addListener('ready', ({ device_id }) => {
        webPlayerDeviceId = device_id;
        loadDevices();
      });
      player.connect();
    }

    function updateSummaryLabel() {
      const select = document.getElementById("device-select");
      const summary = document.getElementById("drawer-summary");
      if (select.selectedIndex >= 0 && select.options[select.selectedIndex].value) {
        const cleanName = select.options[select.selectedIndex].textContent.replace(/\s*\([^)]*\)\s*$/, "");
        summary.textContent = "Højttaler: " + cleanName;
      } else {
        summary.textContent = "Højttaler & indstillinger";
      }
    }

    async function loadDevices() {
      if (!token) return;
      try {
        const res = await fetch("https://api.spotify.com/v1/me/player/devices", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        const select = document.getElementById("device-select");
        const prev = select.value;
        select.innerHTML = "";

        if (data.devices && data.devices.length > 0) {
          data.devices.forEach(dev => {
            const opt = document.createElement("option");
            opt.value = dev.id;
            opt.textContent = `${dev.name} (${dev.type})`;
            // Vælg automatisk en rigtig højttaler/telefon frem for browseren
            if (dev.is_active || (!select.value && dev.id !== webPlayerDeviceId)) {
              opt.selected = true;
            }
            select.appendChild(opt);
          });
          if (prev && Array.from(select.options).some(o => o.value === prev)) {
            select.value = prev;
          }
        } else if (webPlayerDeviceId) {
          const opt = document.createElement("option");
          opt.value = webPlayerDeviceId;
          opt.textContent = "Learn Music (Denne browser)";
          select.appendChild(opt);
        }
        updateSummaryLabel();
      } catch (e) {
        console.error(e);
      }
    }

    function testAudio() {
      if (player) player.activateElement();
      handleScannedCode("spotify:track:2WfaOiMkCvy7F5fcp2zZ8L|Norge (Oslo)");
    }

    function toggleScanner() {
      if (player) player.activateElement();
      isScanning ? stopScanner() : startScanner();
    }

    function startScanner() {
      document.getElementById("scanner-panel").style.display = "block";
      document.getElementById("playback-panel").style.display = "none";
      if (isScanning) return;

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        (decodedText) => {
          handleScannedCode(decodedText);
          stopScanner();
        },
        () => {}
      ).then(() => {
        isScanning = true;
        document.getElementById("scan-toggle-btn").textContent = "Luk kamera";
      });
    }

    function stopScanner() {
      if (html5QrCode && isScanning) {
        html5QrCode.stop().then(() => {
          isScanning = false;
          document.getElementById("scan-toggle-btn").textContent = "Scan kort";
        });
      }
    }

    function parseQrPayload(raw) {
      const parts = raw.split("|").map(s => s.trim());
      const trackPart = parts[0];
      const bonusAnswer = parts.length >= 2 ? parts.slice(1).join(" | ") : null;

      let trackId = null;
      if (trackPart.startsWith("spotify:track:")) {
        trackId = trackPart.split(":")[2].split("?")[0];
      } else {
        const urlMatch = trackPart.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?track\/([a-zA-Z0-9]+)/);
        if (urlMatch) trackId = urlMatch[1];
        else if (/^[a-zA-Z0-9]{22}$/.test(trackPart)) trackId = trackPart;
      }
      return { trackId, bonusAnswer };
    }

    function clearTimers() {
      if (speedTimer) clearTimeout(speedTimer);
      if (countdownInterval) clearInterval(countdownInterval);
    }

    async function handleScannedCode(code) {
      clearTimers();
      const { trackId, bonusAnswer } = parseQrPayload(code);
      if (!trackId) return alert("Ugyldig Spotify QR: " + code);

      const selectedDeviceId = document.getElementById("device-select").value || webPlayerDeviceId;
      if (!selectedDeviceId) {
        document.getElementById("device-panel").open = true;
        return alert("Vælg en højttaler i bunden først.");
      }

      const speedMode = document.getElementById("speed-mode-toggle").checked;
      const disc = document.getElementById("status-disc");
      const statusText = document.getElementById("status-text");

      document.getElementById("scanner-panel").style.display = "none";
      document.getElementById("playback-panel").style.display = "block";
      document.getElementById("bonus-answer-box").style.display = "none";
      document.getElementById("btn-continue-play").style.display = "none";
      disc.classList.remove("paused");

      if (bonusAnswer) {
        document.getElementById("bonus-answer-text").textContent = bonusAnswer;
        document.getElementById("btn-show-bonus").style.display = "block";
      } else {
        document.getElementById("btn-show-bonus").style.display = "none";
      }

      await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${selectedDeviceId}`, {
        method: "PUT",
        body: JSON.stringify({ uris: [`spotify:track:${trackId}`] }),
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` }
      });

      if (speedMode) {
        let secondsLeft = 10;
        disc.textContent = "10s";
        statusText.textContent = "Læg telefonen ned";

        countdownInterval = setInterval(() => {
          secondsLeft--;
          if (secondsLeft > 0) disc.textContent = secondsLeft + "s";
        }, 1000);

        speedTimer = setTimeout(async () => {
          clearInterval(countdownInterval);
          await fetch(`https://api.spotify.com/v1/me/player/pause?device_id=${selectedDeviceId}`, {
            method: "PUT",
            headers: { "Authorization": `Bearer ${token}` }
          });
          disc.textContent = "STOP";
          disc.classList.add("paused");
          statusText.textContent = "10 sek gået";
          document.getElementById("btn-continue-play").style.display = "block";
        }, 10000);
      } else {
        disc.textContent = "🎵";
        statusText.textContent = "Spiller...";
      }
    }

    async function continuePlaying() {
      const selectedDeviceId = document.getElementById("device-select").value || webPlayerDeviceId;
      await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${selectedDeviceId}`, {
        method: "PUT",
        headers: { "Authorization": `Bearer ${token}` }
      });
      const disc = document.getElementById("status-disc");
      disc.textContent = "🎵";
      disc.classList.remove("paused");
      document.getElementById("status-text").textContent = "Spiller videre...";
      document.getElementById("btn-continue-play").style.display = "none";
    }

    function revealBonus() {
      document.getElementById("bonus-answer-box").style.display = "block";
      document.getElementById("btn-show-bonus").style.display = "none";
    }

    async function resetForNextSong() {
      clearTimers();
      const selectedDeviceId = document.getElementById("device-select").value || webPlayerDeviceId;
      if (selectedDeviceId) {
        await fetch(`https://api.spotify.com/v1/me/player/pause?device_id=${selectedDeviceId}`, {
          method: "PUT",
          headers: { "Authorization": `Bearer ${token}` }
        });
      }
      startScanner();
    }
  </script>
</body>
</html>
